name: Build firmware

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    env:
      BUILD_ROOT: /home/runner/work/_temp/ufi001b-openwrt-build
      JOBS: 3
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Reclaim runner space for Rust toolchain
        run: |
          df -h /
          for path in \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup; do
            if [[ -e "$path" ]]; then
              sudo rm -rf --one-file-system "$path"
            fi
          done
          sudo apt-get clean
          df -h /
          available_kib="$(df --output=avail / | tail -n 1)"
          if (( available_kib < 30 * 1024 * 1024 )); then
            echo "stable build requires at least 30 GiB free after cleanup" >&2
            exit 1
          fi

      - name: Preflight repository signing identity
        if: github.event_name != 'pull_request'
        env:
          APK_SIGNING_KEY_PEM: ${{ secrets.APK_SIGNING_KEY_PEM }}
          EXPECTED_PUBLIC_KEY_SHA256: ${{ vars.APK_SIGNING_PUBLIC_KEY_SHA256 }}
        run: |
          if [[ -z "$APK_SIGNING_KEY_PEM" ]]; then
            echo 'APK_SIGNING_KEY_PEM is missing' >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_PUBLIC_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'APK_SIGNING_PUBLIC_KEY_SHA256 is missing or invalid' >&2
            exit 1
          fi
          actual="$(printf '%s\n' "$APK_SIGNING_KEY_PEM" | openssl ec -pubout 2>/dev/null | sha256sum | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_PUBLIC_KEY_SHA256"

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl time xsltproc zstd openssl

      - name: Cache immutable downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.BUILD_ROOT }}/openwrt/dl
          key: openwrt-dl-${{ hashFiles('locks/sources.lock.json') }}

      - name: Build and validate unsigned PR candidate
        if: github.event_name == 'pull_request'
        run: scripts/build.sh

      - name: Build and validate signed firmware
        if: github.event_name != 'pull_request'
        env:
          APK_SIGNING_KEY_PEM: ${{ secrets.APK_SIGNING_KEY_PEM }}
        run: |
          if [[ -z "$APK_SIGNING_KEY_PEM" ]]; then
            echo 'APK_SIGNING_KEY_PEM is required for signed branch builds' >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/ufi001b-apk-private-key.pem"
          (umask 077; printf '%s\n' "$APK_SIGNING_KEY_PEM" > "$key_file")
          export APK_SIGNING_KEY_FILE="$key_file"
          scripts/build.sh

      - name: Collect complete corresponding source
        if: github.event_name != 'pull_request'
        run: |
          python3 scripts/collect-corresponding-source.py \
            --tree "$BUILD_ROOT/openwrt" \
            --out out/corresponding-source

      - name: Verify repository signing identity
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_PUBLIC_KEY_SHA256: ${{ vars.APK_SIGNING_PUBLIC_KEY_SHA256 }}
        run: |
          if [[ ! "$EXPECTED_PUBLIC_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'APK_SIGNING_PUBLIC_KEY_SHA256 repository variable is missing or invalid' >&2
            exit 1
          fi
          actual="$(sha256sum out/stable-squashfs/apk-signing-public-key.pem | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_PUBLIC_KEY_SHA256"

      - name: Upload allow-listed build outputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ufi001b-stable-squashfs
          path: out/stable-squashfs/
          if-no-files-found: error
          retention-days: 3

      - name: Upload corresponding source
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ufi001b-corresponding-source
          path: out/corresponding-source/
          if-no-files-found: error
          retention-days: 3

      - name: Attest build provenance
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: out/stable-squashfs/*
