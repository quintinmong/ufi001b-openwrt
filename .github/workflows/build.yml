name: Build firmware

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Firmware profile to build
        required: true
        default: developer-ext4
        type: choice
        options:
          - developer-ext4
          - stable-squashfs

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ github.event_name == 'pull_request' && fromJSON('["developer-ext4","stable-squashfs"]') || github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.profile)) || fromJSON('["developer-ext4"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_ROOT: /home/runner/work/_temp/ufi001b-openwrt-build
      JOBS: 3
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl time xsltproc zstd openssl

      - name: Cache immutable downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.BUILD_ROOT }}/openwrt/dl
          key: openwrt-dl-${{ hashFiles('locks/sources.lock.json') }}

      - name: Build and validate unsigned PR candidate ${{ matrix.profile }}
        if: github.event_name == 'pull_request'
        run: scripts/build.sh '${{ matrix.profile }}'

      - name: Build and validate signed ${{ matrix.profile }}
        if: github.event_name != 'pull_request'
        env:
          APK_SIGNING_KEY_PEM: ${{ secrets.APK_SIGNING_KEY_PEM }}
        run: |
          if [[ -z "$APK_SIGNING_KEY_PEM" ]]; then
            echo 'APK_SIGNING_KEY_PEM is required for attested branch builds' >&2
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/ufi001b-apk-private-key.pem"
          printf '%s\n' "$APK_SIGNING_KEY_PEM" > "$key_file"
          export APK_SIGNING_KEY_FILE="$key_file"
          scripts/build.sh '${{ matrix.profile }}'

      - name: Verify repository signing identity
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_PUBLIC_KEY_SHA256: ${{ vars.APK_SIGNING_PUBLIC_KEY_SHA256 }}
        run: |
          if [[ ! "$EXPECTED_PUBLIC_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'APK_SIGNING_PUBLIC_KEY_SHA256 repository variable is missing or invalid' >&2
            exit 1
          fi
          actual="$(sha256sum "out/${{ matrix.profile }}/apk-signing-public-key.pem" | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_PUBLIC_KEY_SHA256"

      - name: Upload allow-listed build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ufi001b-${{ matrix.profile }}
          path: out/${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: 3

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: out/${{ matrix.profile }}/*
