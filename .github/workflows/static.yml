name: Static checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install static-check tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck device-tree-compiler python3-yaml

      - name: Validate immutable inputs and policy
        run: |
          python3 scripts/verify-locks.py
          python3 scripts/validate-layout.py
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s tests -v
          config=openwrt-overlay/target/linux/msm89xx/config-6.12
          for symbol in \
            CONFIG_BLOCK=y \
            CONFIG_DEVTMPFS=y \
            CONFIG_EFI_PARTITION=y \
            CONFIG_MMC=y \
            CONFIG_MMC_BLOCK=y \
            CONFIG_MMC_SDHCI=y \
            CONFIG_MMC_SDHCI_MSM=y \
            CONFIG_USB_CONFIGFS=m \
            CONFIG_USB_CONFIGFS_RNDIS=y; do
            grep -qx "$symbol" "$config" || {
              echo "root-mount kernel config missing: $symbol" >&2
              exit 1
            }
          done
          for symbol in \
            USB_CONFIGFS_ACM \
            USB_CONFIGFS_ECM \
            USB_CONFIGFS_ECM_SUBSET \
            USB_CONFIGFS_EEM \
            USB_CONFIGFS_F_FS \
            USB_CONFIGFS_F_HID \
            USB_CONFIGFS_F_LB_SS \
            USB_CONFIGFS_F_MIDI \
            USB_CONFIGFS_F_MIDI2 \
            USB_CONFIGFS_F_PRINTER \
            USB_CONFIGFS_F_TCM \
            USB_CONFIGFS_F_UAC1 \
            USB_CONFIGFS_F_UAC1_LEGACY \
            USB_CONFIGFS_F_UAC2 \
            USB_CONFIGFS_F_UVC \
            USB_CONFIGFS_MASS_STORAGE \
            USB_CONFIGFS_NCM \
            USB_CONFIGFS_OBEX \
            USB_CONFIGFS_PHONET \
            USB_CONFIGFS_SERIAL; do
            grep -qx "# CONFIG_${symbol} is not set" "$config" || {
              echo "unused configfs function is not explicitly disabled: $symbol" >&2
              exit 1
            }
          done
          gadget=package/ufi001b-base/files/etc/init.d/ufi001b-usb-gadget
          for token in \
            'START=90' \
            'functions/rndis.usb0' \
            'os_desc/use' \
            'os_desc/b_vendor_code' \
            'MSFT100' \
            'compatible_id' \
            '5162001' \
            'modprobe usb_f_rndis' \
            'wait_for_usb0' \
            'lan_interface_available' \
            'deferred to late rc link' \
            'configure_direct_lan' \
            "network.lan.device='usb0'" \
            "network.lan.netmask='255.255.255.0'" \
            'ubus call network reload' \
            'ip link set dev usb0 up' \
            'ifup lan' \
            'initial-bind' \
            'UDC unbound' \
            'final-bind' \
            'delayed-15s' \
            'delayed-60s'; do
            grep -Fq "$token" "$gadget" || {
              echo "UFI001B configfs RNDIS gadget missing: $token" >&2
              exit 1
            }
          done
          if grep -Fq 'ip link set dev usb0 master br-lan' "$gadget"; then
            echo 'UFI001B direct USB LAN must not depend on br-lan' >&2
            exit 1
          fi
          if grep -q 'kmod-usb-gadget-serial' openwrt-overlay/target/linux/msm89xx/Makefile; then
            echo 'UFI001B must not install the legacy serial gadget by default' >&2
            exit 1
          fi
          grep -Fq 'IMAGE/rootfs.img/squashfs := append-rootfs | pad-rootfs | pad-to 512' \
            openwrt-overlay/target/linux/msm89xx/image/Makefile || {
              echo 'stable rootfs must invalidate rootfs_data and remain eMMC-sector aligned' >&2
              exit 1
            }
          for profile in configs/stable-squashfs.config; do
            for symbol in CONFIG_KERNEL_DEVTMPFS=y CONFIG_KERNEL_DEVTMPFS_MOUNT=y; do
              grep -qx "$symbol" "$profile" || {
                echo "$profile missing OpenWrt kernel override: $symbol" >&2
                exit 1
              }
            done
          done
          grep -Eq 'DEVICE_PACKAGES :=.*[[:space:]]kmod-mmc([[:space:]]|$)' \
            openwrt-overlay/target/linux/msm89xx/image/msm8916.mk || {
              echo 'UFI001B device packages must select kmod-mmc so package metadata cannot disable MMC_BLOCK' >&2
              exit 1
            }
          python3 - <<'PY'
          from pathlib import Path
          import re
          import yaml

          hil = Path('scripts/flash-stable-hil.ps1').read_text(encoding='utf-8')
          write_targets = re.findall(r"'-b',\s*'([^']+)'", hil)
          if hil.count("'-b'") != 2 or write_targets != ['rootfs', 'boot']:
              raise SystemExit(
                  f'HIL write targets must be exactly rootfs then boot: {write_targets}'
              )

          for path in Path('.github/workflows').glob('*.yml'):
              text = path.read_text(encoding='utf-8')
              yaml.safe_load(text)
              for line_number, line in enumerate(text.splitlines(), 1):
                  match = re.search(r'\buses:\s*([^\s#]+)', line)
                  if match and not re.fullmatch(r'[^@]+@[0-9a-f]{40}', match.group(1)):
                      raise SystemExit(
                          f'{path}:{line_number}: Action must use a full commit SHA'
                      )
              print(f'valid YAML: {path}')
          PY

      - name: Check shell scripts
        run: |
          shellcheck scripts/*.sh
          find package -type f \( -path '*/files/etc/init.d/*' -o -path '*/files/etc/board.d/*' -o -path '*/files/etc/uci-defaults/*' -o -path '*/files/etc/hotplug.d/*' \) -print0 |
            xargs -0 -r shellcheck -s sh

      - name: Parse PowerShell tooling without executing it
        shell: pwsh
        run: |
          foreach ($path in @(
            'scripts/fetch-verify-actions-artifact.ps1',
            'scripts/flash-stable-hil.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List
              throw "PowerShell parse failed: $path"
            }
          }

      - name: Verify canonical Git mirror hashes
        run: |
          check_hash() {
            name="$1"
            version="$2"
            url="$3"
            commit="$4"
            expected="$(python3 - "$name" <<'PY'
          import json
          import sys
          with open('locks/sources.lock.json', encoding='utf-8') as handle:
              print(json.load(handle)['sources'][sys.argv[1]]['source_sha256'])
          PY
          )"
            actual="$(scripts/compute-mirror-hash.sh "$name" "$version" "$url" "$commit" | cut -d' ' -f1)"
            test "$actual" = "$expected"
          }
          check_hash mkbootimg 2021.01.06 https://github.com/osm0sis/mkbootimg.git 8dd5b5b5c68bcf8ecdb5859aa7036df276efcc79
          check_hash qrtr 0.2 https://github.com/andersson/qrtr.git 9dc7a88548c27983e06465d3fbba2ba27d4bc050
          check_hash rmtfs 0.2 https://github.com/andersson/rmtfs.git b08ef6f98ec567876d7d45f15c85c6ed00d7c463
          check_hash rpmsgexport 2018.02.28 https://github.com/andersson/rpmsgexport.git 324d88d668f36c6a5e6a9c2003a050b8a5a3cd60

      - name: Reject firmware and dangerous partition artifacts
        run: |
          if find . -path ./work -prune -o -path ./out -prune -o -type f \( -name '*.mbn' -o -name '*.bin' -o -name '*.img' -o -name 'rawprogram*.xml' -o -name 'patch*.xml' \) -print | grep -q .; then
            echo 'binary firmware or flashing artifact is forbidden in source control' >&2
            exit 1
          fi
          if find . -path ./.git -prune -o -path ./work -prune -o -path ./out -prune -o \
              -type f ! -name '*.md' -exec grep -I -l -E 'BEGIN ([A-Z0-9]+ )?PRIVATE KEY' {} + |
              grep -q .; then
            echo 'private signing key material is forbidden in source control' >&2
            exit 1
          fi
